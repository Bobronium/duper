name: types

on:
  push:
    branches: [ main, poc, pub ]
  pull_request:

concurrency:
  group: types-${{ github.head_ref }}
  cancel-in-progress: true


jobs:
  check:
    # MyPy depend on Python version & platform, so should be run in a matrix
    name: Types ${{ matrix.python-version }} on ${{ startsWith(matrix.os, 'macos-') && 'macOS' || startsWith(matrix.os, 'windows-') && 'Windows' || 'Linux' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-14 ]
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14.0-rc.2']

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run mypy
        run: uv run --python-preference system --extra types mypy duper
